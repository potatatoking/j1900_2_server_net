name: zcode
services:
  zcode:
    build: .
    image: local/zcode:3.15.1
    container_name: zcode
    init: true
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /workspace
    environment:
      HOME: /home/vscode
      ZCODE_DATA_BASE_DIR: /home/vscode
      ZCODE_SERVER_AUTH_TOKEN: ${ZCODE_SERVER_AUTH_TOKEN:?Set ZCODE_SERVER_AUTH_TOKEN in .env}
      TZ: Asia/Shanghai
      TERM: xterm-256color
    volumes:
      - ./data/zcode:/home/vscode/.zcode
      - ./workspace:/workspace
    dns:
      - 10.42.0.3
    networks:
      proxy_lan:
        ipv4_address: 10.42.0.106
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/server-info',{headers:{Cookie:'zcode_lite_token='+process.env.ZCODE_SERVER_AUTH_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
networks:
  proxy_lan:
    name: proxy_lan
    external: true
