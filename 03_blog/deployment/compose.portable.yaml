name: web
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.portable
      args:
        NODE_BASE: "node:24-alpine"
    image: local/j1900-blog:repro
    container_name: web
    user: "1000:1000"
    init: true
    restart: unless-stopped
    env_file: .env
    dns: ["10.42.0.3"]
    networks:
      proxy_lan:
        ipv4_address: "10.42.0.101"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/assets/uploads
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/session').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
networks:
  proxy_lan:
    external: true
    name: "proxy_lan"
